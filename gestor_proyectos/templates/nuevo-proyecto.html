<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Proyecto | Gestor</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            background: #f8fafc;
        }

        .form-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .form-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
        }

        input, textarea {
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus, textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 md:p-8 font-sans antialiased">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-slate-200">

        <!-- CABECERA -->
        <div class="flex items-center gap-3 mb-8 border-b border-slate-200 pb-5">
            <div class="bg-emerald-100 p-3 rounded-xl text-emerald-600">
                <i class="fas fa-plus-circle text-2xl"></i>
            </div>

            <div class="flex-1">
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800">
                    Nuevo Proyecto
                </h1>
                <p class="text-sm text-slate-500">
                    Completa los campos para crear un nuevo proyecto
                </p>
            </div>

            <!-- VOLVER -->
            <a href="{% url 'proyectos' %}"
               class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-xl border border-slate-200 hover:bg-slate-200 transition">
                <i class="fas fa-arrow-left"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>
        </div>

        <!-- ERRORES -->
        {% if errores %}
            <div class="mb-6 rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">
                <p class="font-semibold text-rose-800 flex items-center gap-2 mb-2">
                    <i class="fas fa-exclamation-triangle"></i> Revisa los siguientes datos:
                </p>
                <ul class="list-disc space-y-1 pl-5">
                    {% for error in errores %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <!-- FORMULARIO -->
        <div class="form-card bg-white rounded-2xl p-6 md:p-8 border border-slate-100 shadow-sm">
            <form action="{% url 'crear_proyecto' %}" method="POST" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <!-- NOMBRE -->
                <div class="space-y-2">
                    <label for="id_nombre" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
                        <i class="fas fa-tag text-indigo-400 text-xs"></i>
                        Nombre del proyecto
                    </label>
                    <input
                        type="text"
                        name="nombre"
                        id="id_nombre"
                        required
                        maxlength="100"
                        value="{{ nombre|default:'' }}"
                        placeholder="Ej: Desarrollo E-commerce"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition"
                    >
                </div>

                <!-- DESCRIPCION -->
                <div class="space-y-2">
                    <label for="id_descripcion" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
                        <i class="fas fa-align-left text-indigo-400 text-xs"></i>
                        Descripción
                    </label>
                    <textarea
                        name="descripcion"
                        id="id_descripcion"
                        rows="4"
                        required
                        maxlength="500"
                        placeholder="Describe el objetivo y alcance del proyecto..."
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition resize-y">{{ descripcion|default:'' }}</textarea>
                </div>

                <!-- DURACION -->
                <div class="space-y-2">
                    <label for="id_duracion" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
                        <i class="fas fa-clock text-indigo-400 text-xs"></i>
                        Duración estimada (días)
                    </label>
                    <input
                        type="number"
                        name="duracion"
                        id="id_duracion"
                        min="1"
                        required
                        value="{{ duracion|default:'' }}"
                        placeholder="Ej: 45"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition"
                    >
                    <p class="text-xs text-slate-400">
                        Indica el número entero de días estimados.
                    </p>
                </div>

                <!-- IMAGEN -->
                <div class="space-y-2">
                    <label for="id_imagen" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
                        <i class="fas fa-image text-indigo-400 text-xs"></i>
                        Imagen del proyecto
                    </label>
                    <input
                        type="file"
                        name="imagen"
                        id="id_imagen"
                        accept="image/*"
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm file:mr-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-indigo-700 hover:file:bg-indigo-100 focus:outline-none transition"
                    >
                </div>

                <!-- BOTONES -->
                <div class="pt-4 flex flex-col sm:flex-row items-center gap-3 border-t border-slate-200">
                    <button
                        type="submit"
                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700 transition shadow-md">
                        <i class="fas fa-check-circle"></i>
                        GUARDAR
                    </button>

                    <a
                        href="{% url 'proyectos' %}"
                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-slate-100 text-slate-600 text-sm font-medium rounded-xl hover:bg-slate-200 transition border border-slate-200">
                        <i class="fas fa-times-circle"></i>
                        Cancelar
                    </a>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
