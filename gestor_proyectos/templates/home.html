<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <section class="w-full max-w-2xl rounded-3xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl sm:p-12">
            <span class="inline-flex rounded-full border border-indigo-500/30 bg-indigo-500/10 px-3 py-1 text-xs font-semibold text-indigo-300">
                Sistema activo
            </span>

            <h1 class="mt-6 text-3xl font-bold tracking-tight sm:text-4xl">
                Gestor de Proyectos
            </h1>

            <p class="mx-auto mt-4 max-w-xl text-base leading-relaxed text-slate-400 sm:text-lg">
                Administra tus proyectos, consulta sus detalles y registra nuevos proyectos desde una interfaz sencilla.
            </p>

            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
                <a href="{% url 'proyectos' %}"
                   class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700">
                    Ver proyectos
                </a>

                <a href="{% url 'nuevo_proyecto' %}"
                   class="rounded-xl border border-slate-700 bg-slate-800 px-5 py-3 text-sm font-semibold text-slate-200 transition hover:bg-slate-700">
                    Crear proyecto
                </a>
            </div>
        </section>
    </main>
</body>
</html>
