{% extends 'layouts/base.html' %}

{% block title %}Iniciar Sesión · Gestor de Proyectos{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10">
    <div class="bg-white border border-slate-200/80 rounded-2xl p-6 md:p-8 shadow-sm">
        
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl mx-auto flex items-center justify-center text-xl mb-3 border border-indigo-100">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Iniciar Sesión</h1>
            <p class="text-xs text-slate-500 mt-1">Ingresa tus credenciales para acceder al gestor</p>
        </div>

        <!-- Mensajes de Error de credenciales -->
        {% if form.errors %}
            <div class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700">
                <p class="font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Usuario o contraseña incorrectos.</p>
            </div>
        {% endif %}

        <!-- Formulario de Login -->
        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="id_username" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">
                    Usuario
                </label>
                <input type="text" name="username" id="id_username" required
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none"
                       placeholder="Nombre de usuario">
            </div>

            <div>
                <label for="id_password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">
                    Contraseña
                </label>
                <input type="password" name="password" id="id_password" required
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all outline-none"
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl transition-colors shadow-sm mt-2">
                Ingresar
            </button>
        </form>

    </div>
</div>
{% endblock %}
