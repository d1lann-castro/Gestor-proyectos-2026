{% extends 'layouts/base.html' %}
{% block title %}Editar Grupo{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <!-- Encabezado -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-3">
                <svg class="w-7 h-7 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
                Editar Grupo
            </h1>
            <p class="text-sm text-slate-500 mt-1">Modifica el nombre del grupo seleccionado</p>
        </div>
    </div>

    <!-- Tarjeta del formulario -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200/60 p-6 mb-8 form-card">
        <form method="post" class="flex flex-col gap-4">
            {% csrf_token %}
            <div>
                <label for="nombre" class="block text-xs font-medium text-slate-600 mb-1.5">
                    Nombre del grupo
                </label>
                <input type="text" 
                       name="nombre" 
                       id="nombre" 
                       value="{{ grupo.name }}" 
                       required 
                       maxlength="150" 
                       class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all placeholder:text-slate-400">
            </div>
            
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200/60">
                <a href="{% url 'grupos' %}" 
                   class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all">
                    Cancelar
                </a>
                <button type="submit" 
                        class="inline-flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-all shadow-sm hover:shadow">
                    Guardar cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
